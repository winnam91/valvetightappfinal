[versions]
agp = "8.6.1"
kotlin = "1.9.23" # Changed to align with AGP 8.4.1 for more stability
coreKtx = "1.16.0"   # Changed to a version compatible with SDK 34
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.1.4" # Downgraded slightly for broader compatibility if 2.2.1 was an issue
lifecycleRuntimeKtx = "2.8.3" # Adjusted to a commonly compatible version
activityKtx = "1.10.1"       # <<< CHANGED/ADDED: This is the key version for activity-ktx
junit = "4.13.2"
androidxJunit = "1.2.1"
espressoCore = "3.6.1"
activity = "1.10.1"
# Removed 'activity = "1.10.1"' as we are now using activityKtx

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
google-android-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" } # <<< CHANGED/ADDED

# Testing Libraries
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
# Removed 'androidx-activity' as we now use 'androidx-activity-ktx'

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }